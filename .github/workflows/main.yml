name: Verify Human Identity

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install ClawHub
        run: npm install -g clawhub

      - name: Install verified-agent-identity skill
        run: clawhub install verified-agent-identity --force

      - name: Create Ethereum Identity
        run: npx clawhub verified-agent-identity create

      - name: Link Human to Agent
        run: npx clawhub verified-agent-identity link --name Rival027
